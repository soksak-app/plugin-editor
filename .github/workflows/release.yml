name: release
# build-machine: skip smoke reason=a plugin runs only inside the application; the core window checks start it

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# The core release whose sok packs the plugin. It has no relation to the version that this repository releases.
env:
  CORE_RELEASE: v0.0.18

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Install
        run: make install
      - name: Test
        run: make test
      - name: Check
        run: make check
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/core
          ref: ${{ env.CORE_RELEASE }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/sok/wailsv3/go.mod
      - name: Build sok
        run: go build -C core/packages/sok/wailsv3 -o "$RUNNER_TEMP/sok" ./src/cmd/sok
      - name: Pack
        run: make pack SOK="$RUNNER_TEMP/sok" OUT=dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
